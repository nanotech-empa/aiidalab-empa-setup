name: Runtime compatibility
on:
  pull_request:
  push:
    branches: [main]
jobs:
  registration:
    runs-on: ubuntu-latest
    env:
      AIIDA_PATH: /tmp/empa-setup-ci
    strategy:
      fail-fast: false
      matrix:
        aiida: ['aiida-core==2.9.4']
        aiidalab: ['26.9.0', '26.10.0']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: nanotech-empa/aiidalab-alps-files
          ref: c7ff1edc98fab78b53a9e5d4e3024f819036e50d
          path: companion-catalog
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install the approved runtime boundary
        run: python -m pip install -e . 'aiidalab==${{ matrix.aiidalab }}' '${{ matrix.aiida }}' pytest
      - name: Register codes without interactive input
        env:
          AIIDA_PATH: ${{ runner.temp }}/setup-aiida
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
          EMPA_SETUP_CATALOG: ${{ github.workspace }}/companion-catalog/config.yml
        run: python -m pytest -q tests
